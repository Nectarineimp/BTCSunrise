<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <style>
        body { font-family: monospace; line-height: 1.5; color: #000; background: #fff; margin: 20px; padding: 0; }
        a { color: #0000ee; text-decoration: underline; }
        a:visited { color: #551a8b; }
        .wrapper { display: flex; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; }
        main { flex: 3; min-width: 300px; padding-right: 40px; }
        sidebar { flex: 1; min-width: 250px; border-left: 1px dotted #000; padding-left: 20px; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #000; padding: 6px 10px; text-align: left; font-size: 13px; }
        th { background-color: #f0f0f0; }
        hr { border: none; border-top: 1px dashed #000; margin: 20px 0; }
        .sidebar-section { margin-bottom: 30px; }
        .sidebar-section h3 { margin-bottom: 5px; text-transform: uppercase; font-size: 14px; background: #000; color: #fff; padding: 2px 5px; }
        .sidebar-section ul { list-style-type: none; padding-left: 0; margin-top: 5px; }
        .sidebar-section li { margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <main>
            {{ content }}
        </main>

        <sidebar>
            <h2><a href="{{ site.baseurl }}/">{{ site.title }}</a></h2>
            <p><em>{{ site.description }}</em></p>
            <hr>

            <div class="sidebar-section">
                <h3>Education</h3>
                <ul>
                    <li><strong><a href="{{ site.baseurl }}/primer.html">Trading Jargon Primer</a></strong></li>
                </ul>
            </div>

            <div class="sidebar-section">
                <h3>Previous Intel</h3>
                <ul>
                    {% for post in site.posts %}
                        <li><a href="{{ post.url | relative_url }}">{{ post.date | date: "%m/%d/%Y" }} - {{ post.title }}</a></li>
                    {% endfor %}
                </ul>
            </div>

            <div class="sidebar-section">
                <h3>Contact</h3>
                <p>Feedback or Inquiries:<br>
                <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a></p>
            </div>
        </sidebar>
    </div>
</body>
</html>
